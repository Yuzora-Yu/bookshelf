<g stroke="#474842" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M74 158 L924 160 L926 297 L73 295 Z M82 167 L917 168 L917 287 L82 286 Z"/>
<path d="M74 389 L924 391 L926 533 L73 531 Z M82 398 L917 399 L917 522 L82 522 Z"/>
<path d="M289 398 L289 522 M296 398 L296 522 M496 398 L496 522 M503 398 L503 522 M703 398 L703 522 M710 398 L710 522"/>
</g>
<g stroke="#7a7b73" opacity=".28" stroke-width="1" fill="none"><path d="M72 155 L929 159 L928 300 L70 298 Z M72 386 L929 391 L930 536 L70 534 Z M287 399 L287 523 M494 398 L494 523 M701 398 L701 523"/></g>
<g fill="#474842" font-family="Yu Mincho,serif" font-size="22" text-anchor="middle"><text x="500" y="238">仕切りなし</text><text x="500" y="367">固定された仕切り</text></g>
<g stroke="#74756e" stroke-width="1.1" fill="none"><path d="M480 374 L298 393 M500 374 L500 393 M520 374 L705 393"/></g>
<g fill="#64655f" font-family="Yu Mincho,serif" font-size="18"><text x="72" y="586">外形はほぼ同じ。蓋は取り外せる。</text><text x="72" y="618">車輪と手掛け穴は省略。寸法・比率は模式表現。</text></g>
</svg>
