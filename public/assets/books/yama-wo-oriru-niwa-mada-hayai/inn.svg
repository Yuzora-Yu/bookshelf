<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
<title id="title">折返し 館内図</title>
<desc id="desc">斜面の上側に二階建ての本館、下側に三階建ての旧館。本館二階と旧館三階は上の渡り廊下、本館一階と旧館二階は下の渡り廊下でつながる。各棟に内階段がある。旧館一階から下の庭へ出られ、外の坂を上ると本館の玄関へ戻れる。</desc>
<rect width="1000" height="820" fill="#f7f5ef"/>
<g font-family="Yu Gothic, Meiryo, sans-serif" fill="#41433c" text-anchor="middle">
<text x="500" y="52" font-size="29">折返し　館内図</text>
<text x="239" y="112" font-size="24">本館</text><text x="774" y="112" font-size="24">旧館</text>
</g>
