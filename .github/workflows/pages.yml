name: Deploy Pages
on:
  workflow_dispatch:
    inputs:
      base_path:
        description: "Public path (leading and trailing slash)"
        default: "/bookshelf/"
        required: true
      site_url:
        description: "Public origin (without a path)"
        default: "https://yuzora-yu.github.io"
        required: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
      - run: npm run check
      - run: npm run build
        env:
          BASE_PATH: ${{ inputs.base_path }}
          SITE_URL: ${{ inputs.site_url }}
      - run: npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
