<g font-family="Yu Gothic, Meiryo, sans-serif" fill="#41433c" text-anchor="middle">
<text x="238" y="184" font-size="25">二階</text><text x="251" y="227" font-size="22">客室</text>
<text x="238" y="348" font-size="25">一階</text><text x="238" y="392" font-size="19">玄関・帳場・食堂</text><text x="238" y="431" font-size="19">厨房・風呂</text>
<text x="774" y="184" font-size="25">三階</text><text x="759" y="227" font-size="21">旧客室・物置</text>
<text x="774" y="348" font-size="25">二階</text><text x="759" y="391" font-size="21">読書室・談話室</text>
<text x="774" y="512" font-size="25">一階</text><text x="774" y="553" font-size="21">元厨房・資料室</text><text x="774" y="590" font-size="18">下の庭への戸</text>
<text x="505" y="203" font-size="19">上の渡り廊下</text><text x="505" y="365" font-size="19">下の渡り廊下</text>
<text x="150" y="281" font-size="16">内階段</text><text x="867" y="281" font-size="16">内階段</text><text x="867" y="446" font-size="16">内階段</text>
<text x="226" y="520" font-size="21">玄関前・車道へ</text><text x="786" y="695" font-size="23">下の庭</text><text x="390" y="675" font-size="20">外の坂</text>
<text x="500" y="779" font-size="18">二つの渡り廊下は、それぞれ同じ高さの階をつなぐ。</text>
</g>
