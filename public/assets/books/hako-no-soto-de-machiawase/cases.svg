<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">二つの長箱</title><desc id="desc">蓋を外して上から見た模式図。上は仕切りのない箱。下は固定した三枚の板で四区画に分かれた箱。蓋の文字は現在の中身と一致していない。</desc>
<rect width="1000" height="660" fill="#f5f2eb"/>
