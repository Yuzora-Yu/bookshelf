<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
<title id="title">汐見大学旧分室・現在の配置</title><desc id="desc">南の玄関から北へ廊下。西側に談話室、閲覧室。東側に実習室、編集室。突き当たりに保管室。編集室と保管室の窓は固定窓。南側の避難口は廊下から出られる。旧裏口は壁。</desc>
